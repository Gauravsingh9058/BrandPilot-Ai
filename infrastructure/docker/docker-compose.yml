version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vidsnapai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: vidsnapai
    ports:
      - "5432:5432"
    volumes:
      - vidsnapai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vidsnapai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - vidsnapai_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vidsnapai_postgres_data:
  vidsnapai_redis_data:
